    <!-- Content-Security-Policy via meta (same GitHub Pages header limitation).
         Allows only the origins the site actually uses: Google Fonts, GA/gtag,

    <!-- GitHub Pages SPA routing: restores URL stored by 404.html
         Also strips any trailing slash that slipped through -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          try {
            var url = new URL(redirect);
            // Strip trailing slash from pathname (except bare root)
            if (url.pathname.length > 1 && url.pathname.slice(-1) === '/') {
              url.pathname = url.pathname.slice(0, -1);
            }
            history.replaceState(null, null, url.pathname + url.search + url.hash);
          } catch (e) {
            // Fallback for browsers without URL constructor
            if (redirect !== location.href) {
              history.replaceState(null, null, redirect);
            }
          }
        }
      })();
    </script>

  <!-- Google AdSense — loaded on first real user interaction (scroll/touch/click), with a
       6s fallback timer so ads still show for users who never interact (e.g. crawlers, or
       people who land and just read). This keeps ~221 KiB of ad JS out of the way of the
       metrics that matter (FCP/LCP/TBT) without meaningfully hurting ad revenue. -->
  <script>
    function loadAdsense() {
      if (window.__adsenseLoaded) return;
      window.__adsenseLoaded = true;
      var s = document.createElement('script');
      s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2594206998239067';
      s.async = true;
      s.crossOrigin = 'anonymous';
      document.head.appendChild(s);
    }
    window.addEventListener('load', function() {
      var fired = false;
      var trigger = function() {
        if (fired) return;
        fired = true;
        ['scroll', 'touchstart', 'mousemove', 'keydown'].forEach(function(evt) {
          window.removeEventListener(evt, trigger);
        });
        loadAdsense();
      };
      ['scroll', 'touchstart', 'mousemove', 'keydown'].forEach(function(evt) {
        window.addEventListener(evt, trigger, { passive: true, once: true });
      });
      setTimeout(trigger, 6000);
    });
  </script>
